<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7CE" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="crestGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#121215" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Crest Icon -->
  <g transform="translate(6, 6)">
    <rect x="0" y="0" width="52" height="52" rx="10" fill="#141419" stroke="url(#goldGrad)" stroke-width="1.5" />
    <!-- Subtle diamond corner accents -->
    <path d="M 26 6 L 28 8 L 26 10 L 24 8 Z" fill="url(#goldGrad)" />
    <path d="M 26 42 L 28 44 L 26 46 L 24 44 Z" fill="url(#goldGrad)" />
    
    <!-- Monogram AAJ -->
    <text x="26" y="34" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="21" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">AAJ</text>
    
    <!-- Crown / Star motif -->
    <circle cx="26" cy="14" r="1.5" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <text x="72" y="32" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="20" font-weight="700" fill="#FAF8F5" letter-spacing="3.5">
    AAJ <tspan fill="url(#goldGrad)">GROUPS</tspan>
  </text>
  <text x="72" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="600" fill="#A1A1AA" letter-spacing="3.8">
    LUXURY EVENT MANAGEMENT • KERALA
  </text>
</svg>

